const Q={
agen1:{q:'Sesilia (1 tahun) meniru kata “mamam” dari ibunya. Mengapa keluarga disebut agen sosialisasi utama pada tahap ini?',o:['Karena keluarga adalah lingkungan pertama yang paling dekat dan intens, tempat dasar bahasa dan perilaku dibentuk','Karena keluarga memiliki aturan tertulis dan kurikulum untuk menilai perkembangan anak','Karena keluarga menyebarkan nilai dan tren kepada banyak orang sekaligus lewat berbagai media'],e:'Keluarga adalah agen sosialisasi pertama dan utama. Bayi belajar bahasa dan perilaku dasar dari orang terdekat. Aturan tertulis ciri agen formal (sekolah), sedangkan penyebaran tren luas ciri media massa.'},
bentuk1:{q:'Ibu mengajarkan “mamam” lewat obrolan dan kasih sayang sehari-hari, tanpa jadwal atau kurikulum. Apa bentuk sosialisasinya?',o:['Sosialisasi informal (primer): berlangsung alami di dalam keluarga tanpa aturan resmi','Sosialisasi formal (primer): berlangsung di dalam keluarga dengan aturan tertulis','Sosialisasi informal (sekunder): berlangsung alami di luar keluarga setelah anak dewasa'],e:'Di keluarga, belajar terjadi alami tanpa aturan resmi, itulah sosialisasi informal atau primer. Sosialisasi sekunder terjadi setelah primer dan berlangsung di luar keluarga.'},
agen2:{q:'Sesilia (7 tahun) bermain masak-masakan dan bergantian mainan dengan anak tetangga di teras. Agen sosialisasi mana yang dominan?',o:['Teman sebaya: hubungan setara yang membuat anak belajar berbagi dan bekerja sama','Keluarga: orang tua tetap menentukan seluruh aturan permainan di teras rumah','Lingkungan masyarakat: norma warga sekitar yang mengatur cara anak bermain'],e:'Anak-anak sepermainan adalah teman sebaya. Mereka berinteraksi secara setara, tidak diatur langsung oleh orang tua, sehingga belajar berbagi dan bekerja sama.'},
fungsi2:{q:'Saat bermain, Sesilia berpura-pura menjadi ibu dan temannya menjadi pembeli. Apa fungsi teman sebaya bagi Sesilia, dan ciri tahap apa yang tampak?',o:['Belajar solidaritas dan berinteraksi tanpa otoritas orang tua, sambil mengambil peran orang lain (Play Stage)','Belajar menaati aturan resmi dan sanksi, sambil memahami harapan seluruh masyarakat (Generalized Other)','Meniru ucapan orang dewasa tanpa memahami maknanya (Preparatory Stage)'],e:'Teman sebaya melatih solidaritas dan interaksi tanpa otoritas orang tua. Bermain peran menandai Play Stage, saat anak mulai memahami peran orang lain. Meniru tanpa paham makna ciri Preparatory Stage.'},
sekolah3:{q:'Bu Guru melarang mencontek dan memberi sanksi bagi pelanggar. Mengapa sekolah disebut agen sosialisasi formal, dan nilai apa yang ditanamkan?',o:['Karena memiliki aturan resmi, kurikulum, dan sanksi yang terstruktur; menanamkan kejujuran dan disiplin','Karena guru lebih dekat secara emosional daripada orang tua; menanamkan kasih sayang','Karena siswa menyusun aturan sendiri secara bebas; menanamkan solidaritas tanpa otoritas'],e:'Sekolah bersifat formal karena punya tata aturan, kurikulum, dan sanksi resmi. Larangan mencontek menanamkan kejujuran dan disiplin. Aturan yang dibuat bebas oleh sesama anak ciri teman sebaya.'},
media3:{q:'Sesilia meniru gaya berpakaian selebgram di media sosial. Pernyataan mana yang paling tepat tentang media massa sebagai agen sosialisasi?',o:['Media massa menyebarkan tren dan nilai secara luas sehingga memengaruhi gaya hidup; dampaknya bisa positif atau negatif, jadi perlu selektif','Media massa tergolong agen formal karena isinya diatur kurikulum, sehingga pengaruhnya selalu positif','Media massa hanya memengaruhi hiburan dan tidak memengaruhi perilaku karena interaksinya tidak langsung'],e:'Media massa adalah agen sosialisasi modern. Ia menyebarkan tren dan nilai kepada banyak orang sehingga membentuk gaya hidup. Dampaknya bisa positif maupun negatif, jadi pengguna perlu selektif.'},
lingk4:{q:'Sesilia ikut kerja bakti dan menyesuaikan diri dengan kebiasaan warga di tempat tinggalnya. Agen apa yang berperan, dan apa yang ditanamkannya?',o:['Lingkungan masyarakat: menanamkan norma dan kebiasaan sekitar tempat tinggal, seperti gotong royong','Teman sebaya: menanamkan solidaritas lewat hubungan setara dalam kelompok seumuran','Tempat kerja: menanamkan aturan resmi perusahaan lewat jabatan dan kontrak'],e:'Lingkungan masyarakat menanamkan norma sekitar tempat tinggal, misalnya gotong royong dan kebersamaan, lewat kebiasaan warga. Ini berbeda dari teman sebaya (kelompok seumuran) dan tempat kerja (aturan organisasi).'},
sek4:{q:'Setelah bekerja dan ikut arisan, Sesilia belajar peran baru di luar keluarga. Mengapa ini sosialisasi sekunder, dan tahap Mead apa yang tercapai?',o:['Terjadi setelah sosialisasi primer, saat orang dewasa belajar peran dan norma baru; mencerminkan Generalized Other','Terjadi sebelum sosialisasi primer di keluarga; mencerminkan Preparatory Stage','Terjadi hanya di lembaga formal seperti sekolah; mencerminkan Game Stage'],e:'Sosialisasi sekunder berlangsung setelah primer, saat dewasa belajar peran baru di kerja dan masyarakat. Memahami norma dan harapan masyarakat luas adalah ciri Generalized Other.'}};

let AC,mg,sg,nb,vM=.6,vS=.7,mut=false,want=0,ct=null,ms=0,mt=0,paused=false;
const av=()=>{if(AC){mg.gain.setTargetAtTime(mut?0:vM*.5,AC.currentTime,.05);sg.gain.setTargetAtTime(mut?0:vS,AC.currentTime,.05)}$('mu').style.opacity=mut?.5:1};
function nt(f,t,d,ty,v,o2,at){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;at=at||.015;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(o2);o.start(t);o.stop(t+d+.05)}
function nz(t,d,v,hp,o2){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(o2);s.start(t);s.stop(t+d+.02)}
function kick(t,o2){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(o2);o.start(t);o.stop(t+.25)}
const CHS=[[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]],[[392,493.9,587.3],[329.6,392,493.9],[261.6,329.6,392],[293.7,370,440]],[[261.6,329.6,392],[196,246.9,293.7],[220,261.6,329.6],[174.6,220,261.6]],[[293.7,370,440],[246.9,293.7,370],[196,246.9,293.7],[220,277.2,329.6]]],
SCL=[[0,523.25,587.33,659.25,783.99,880,1046.5],[0,784,880,987.8,1175,1319],[0,523.25,587.33,659.25,783.99,880,1046.5],[0,587.3,659.3,740,880,987.8,1175]],
MPT=[[[3,0,5,4,3,0,2,0],[4,0,5,4,3,0,2,0],[5,0,6,5,4,0,3,0],[4,3,2,0,3,0,0,0]],[[3,4,5,4,3,0,2,3],[4,5,4,3,2,0,3,0],[3,3,4,5,4,3,2,0],[2,3,4,0,5,4,3,0]],[[3,0,5,0,4,0,3,2],[2,0,4,0,3,0,2,1],[3,0,4,5,0,4,3,0],[2,0,3,0,2,3,0,0]],[[4,0,0,0,5,0,3,0],[3,0,0,0,4,0,2,0],[2,0,0,0,3,0,4,0],[3,0,0,0,2,0,1,0]]],BPM=[72,128,118,80];
function step(i,k,b,t,e,d){const c=CHS[i][b],m=MPT[i][b][k],f=m?SCL[i][m]:0;
if(i==0){const pn=(fr,du,v)=>{nt(fr,t,du,'sine',v,d,.01);nt(fr*2,t,du*.5,'triangle',v*.3,d,.01)};pn(c[[0,1,2,1,2,1,2,1][k]],e*5,.07);if(k==0)pn(c[0]/2,e*7,.1);if(f&&k%4==0)pn(f,e*4,.1)}
else if(i==1){if(k%2==0)c.forEach((fr,j)=>nt(fr,t+j*.012,.14,'triangle',.05,d,.004));if(f)nt(f*2,t,.3,'sine',.11,d,.004);nz(t,.04,k%2?.03:.015,6000,d);if(k==4)nt(880,t,.05,'square',.03,d,.002);if(k==0)nt(c[0]/2,t,e*2,'sine',.1,d)}
else if(i==2){if(k==0||k==4)kick(t,d);if(k%2)nz(t,.05,.04,7000,d);if(k==4)nz(t,.12,.05,2000,d);if([0,3,4,6].includes(k))nt(c[0]/2,t,e*1.6,'triangle',.1,d,.005);if(k==0||k==3)c.forEach(fr=>nt(fr,t,e*1.2,'square',.012,d,.005));if(f)nt(f,t,e*1.5,'triangle',.09,d,.01)}
else{if(k==0)c.forEach(fr=>nt(fr,t,e*8,'triangle',.035,d,.7));if(k%2==0)nt(c[[0,1,2,1][k/2]]*2,t,e*3,'sine',.05,d,.01);if(f)nt(f,t,e*3.5,'sine',.08,d,.05)}}
function sched(){if(!AC||!ct||ct.el||paused)return;const e=60/BPM[ct.i]/2;while(mt<AC.currentTime+.4){step(ct.i,ms%8,Math.floor(ms/8)%4,mt,e,ct.g);mt+=e;ms++}}
function setTrack(i){want=i;if(!AC||(ct&&ct.i==i))return;const t=AC.currentTime;
if(ct){const o=ct;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>{if(o.el)o.el.pause()},1400)}
const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+1.2);g.connect(mg);ct={i,g};
if(AF.bgm[i]){try{const el=new Audio(AF.bgm[i]);el.loop=true;AC.createMediaElementSource(el).connect(g);el.play().catch(()=>{});ct.el=el}catch(e){}}
ms=0;mt=t+.1}
function startA(){if(AC){if(AC.state!='running'&&!paused)AC.resume();return}try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();mg.connect(AC.destination);sg.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=nb.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=Math.random()*2-1;av();AC.resume();setTrack(want);setInterval(sched,100)}
function pauseM(){if(!AC)return;paused=true;mg.gain.setTargetAtTime(0,AC.currentTime,.08);setTimeout(()=>{if(paused)AC.suspend()},400)}
function resumeM(){if(!AC||!paused)return;paused=false;AC.resume();mt=AC.currentTime+.1;av()}
const SF={ok:[[659,0,.15],[880,.1,.25]],bad:[[220,0,.2],[165,.14,.3]],pt:[[1318,0,.12],[1760,.07,.2]],talk:[[520,0,.08],[660,.06,.1]],pick:[[988,0,.1],[1319,.07,.18]],mis:[[523,0,.15],[659,.09,.15],[784,.18,.15],[1047,.27,.3]],lvl:[[523,0,.2],[659,.12,.2],[784,.24,.2],[1047,.36,.2],[1319,.48,.5]],new:[[392,0,.15],[523,.1,.15],[784,.2,.35]],win:[[523,0,.15],[523,.15,.15],[523,.3,.15],[659,.45,.25],[784,.7,.2],[659,.9,.15],[784,1.05,.2],[1047,1.3,.6]]};
function sfx(n,d){if(AF.sfx[n]){try{const a=new Audio(AF.sfx[n]);a.volume=mut?0:vS;setTimeout(()=>a.play().catch(()=>{}),(d||0)*1e3)}catch(e){}return}
if(!AC||paused)return;const t=AC.currentTime+(d||0);(SF[n]||[]).forEach(a=>nt(a[0],t+a[1],a[2],'triangle',.12,sg))}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,startA,{once:true}));
let rotX=0;function chkRot(){$('rot').classList.toggle('hidden',!(TOUCH&&!rotX&&innerWidth<700&&innerHeight>innerWidth))}
addEventListener('resize',chkRot);addEventListener('orientationchange',chkRot);chkRot();
if(TOUCH){$('dlg').querySelector('button').textContent='Lanjut';LV[0].story=LV[0].story.replace('tekan Spasi di dekatnya','ketuk tombol E di dekatnya')}
load(-1,pick);tick();
